events{
    worker_connections 1024;
}

http {
    #defining the 3 instances of the app
    upstream limiter_cluster {
        server app-1:8080;
        server app-2:8080;
        server app-3:8080;
        
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://limiter_cluster;
            
            #setting rate-limiter headers for the reverse proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}